<!DOCTYPE html>
<html>
    <title>
        LMS
    </title>
    <head>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Roboto, sans-serif;
                background-image: url("https://lms.prasetiyamulya.ac.id/pluginfile.php/1/theme_moove/loginbgimg/1787063519/bg_login_mdl.jpg");
                background-size: cover;
            }
            .box {
                display: flex;
                width: 760px;
                background-color: #fff;
                border-radius: 10px;
                padding: 20px;
                box-sizing: border-box;
                text-align: center;
            }

            .left {
                flex: 1.2;

            }

            .right {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 10px;
            padding-right: 20px;
            color: #6e6d6e;
            }

            .cookie {
                text-align: center;
                gap: 10px;
                font-size: 10px;
                margin-top: 10px;
    
            }
            
            input[type="email"],
            input[type="password"] {
                width: 100%;
                max-width: 330px;
                padding: 12px 14px;
                margin: 8px 0;
                border: 1px solid #ccc;
                border-radius: 10px;
                font-size: 16px;
                box-sizing: border-box;
            }
            a[href] {
                display: block;
                width: 100%;
                max-width: 330px;
                color: #6e6d6e;
                text-decoration: none;
                font-size: 15px;
                text-align: center;
                margin: 10px auto 0;
            }

            input[type="submit"] {
                background-color: #6e6d6e;
                color: white;
                padding: 12px 20px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                width: 100%;
                max-width: 330px;
                font-size: 15px;
            }

        </style>
    </head>
    <body>
        <div class="box">
            <div class="left">
                <img src="https://keystoneacademic-res.cloudinary.com/image/upload/c_pad,w_1920,h_640/dpr_1/f_auto/q_auto/v1/element/17/171020_170975_Logo1.jpg" alt="Logo" width="320px"><br>
                <input type="email" placeholder="Username or email"><br>
                <input type="password" placeholder="Password"><br>
                <input type="submit" value="Log in"><br>
                <a href="https://www.djangoproject.com/">Lost Password?</a><br>
            </div>
            <div class="right">
                <div>
                <p>This site best viewed in Google Chrome.</p>
                <p>Cookies notice</p>
                </div>
            </div>
        </div>
    </body>
</html>
